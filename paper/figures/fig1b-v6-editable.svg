<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="53mm" height="26.5mm" viewBox="0 0 53 26.5">
  <title>Fig. 1(b): aligned single-window probe timing</title>
  <desc>Compact timing panel with one waveform per pulse window. Alternative phases are encoded by labels rather than overlaid carriers, and all measurement symbols share one column.</desc>
  <defs>
    <marker id="time-arrow" markerWidth="0.95" markerHeight="0.52" refX="0.89" refY="0.26" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0.95,0.26 L0,0.52 z" fill="#34383a"/>
    </marker>
    <marker id="dim-start" markerWidth="0.78" markerHeight="0.44" refX="0.07" refY="0.22" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.72,0 L0,0.22 L0.72,0.44" fill="none" stroke="#6f757b" stroke-width="0.13"/>
    </marker>
    <marker id="dim-end" markerWidth="0.78" markerHeight="0.44" refX="0.71" refY="0.22" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0.72,0.22 L0,0.44" fill="none" stroke="#6f757b" stroke-width="0.13"/>
    </marker>
    <marker id="leader-arrow" markerWidth="0.72" markerHeight="0.4" refX="0.65" refY="0.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0.72,0.2 L0,0.4 z" fill="#656b71"/>
    </marker>

    <!-- Sampled sin^2(pi t/T) envelope on an 8 mm pulse window. -->
    <g id="sin2-envelope">
      <path d="M0,0 L0.333,-0.031 L1,-0.264 L1.667,-0.667 L2.333,-1.133 L3,-1.536 L3.667,-1.769 L4.333,-1.769 L5,-1.536 L5.667,-1.133 L6.333,-0.667 L7,-0.264 L7.667,-0.031 L8,0"
            fill="none" stroke="currentColor" stroke-width="0.16" stroke-linejoin="round"/>
      <path d="M0,0 L0.333,0.031 L1,0.264 L1.667,0.667 L2.333,1.133 L3,1.536 L3.667,1.769 L4.333,1.769 L5,1.536 L5.667,1.133 L6.333,0.667 L7,0.264 L7.667,0.031 L8,0"
            fill="none" stroke="currentColor" stroke-width="0.16" stroke-linejoin="round"/>
    </g>
    <!-- Quadratic half-cycles peak exactly on the sampled envelope above. -->
    <path id="sin2-carrier"
          d="M0,0 Q0.333,-0.062 0.667,0 Q1,0.528 1.333,0
             Q1.667,-1.334 2,0 Q2.333,2.266 2.667,0
             Q3,-3.072 3.333,0 Q3.667,3.538 4,0
             Q4.333,-3.538 4.667,0 Q5,3.072 5.333,0
             Q5.667,-2.266 6,0 Q6.333,1.334 6.667,0
             Q7,-0.528 7.333,0 Q7.667,0.062 8,0"
          fill="none" stroke="currentColor" stroke-width="0.23"/>
    <path id="sin2-carrier-q"
          d="M0,-0.031 Q0.333,0 0.667,0.117 Q1,0 1.333,-0.45
             Q1.667,0 2,0.9 Q2.333,0 2.667,-1.35
             Q3,0 3.333,1.68 Q3.667,0 4,-1.8
             Q4.333,0 4.667,1.68 Q5,0 5.333,-1.35
             Q5.667,0 6,0.9 Q6.333,0 6.667,-0.45
             Q7,0 7.333,0.117 Q7.667,0 8,-0.031"
          fill="none" stroke="currentColor" stroke-width="0.21"/>

    <g id="meter-symbol">
      <rect x="0" y="0" width="4.5" height="4.3" rx="0.2" fill="#ffffff" stroke="#3f444a" stroke-width="0.23"/>
      <path d="M0.9,3.15 A1.35,1.35 0 0 1 3.6,3.15" fill="none" stroke="#3f444a" stroke-width="0.2"/>
      <path d="M2.25,2.98 L3.22,1.62" fill="none" stroke="#3f444a" stroke-width="0.2" stroke-linecap="round"/>
      <circle cx="2.25" cy="2.98" r="0.14" fill="#3f444a"/>
    </g>

    <style>
      .panel { font-family: "Times New Roman", "Latin Modern Roman", serif; font-size: 2.35px; font-weight: 700; fill: #17191c; }
      .math { font-family: "Times New Roman", "Latin Modern Roman", serif; font-size: 1.58px; font-style: italic; fill: #25292e; }
      .small { font-family: "Times New Roman", "Latin Modern Roman", serif; font-size: 1.22px; font-style: italic; fill: #555b61; }
      .timeline { fill: none; stroke: #34383a; stroke-width: 0.2; marker-end: url(#time-arrow); }
      .guide { fill: none; stroke: #6f757b; stroke-width: 0.14; marker-start: url(#dim-start); marker-end: url(#dim-end); }
      .scan-arrow { fill: none; stroke: #858b91; stroke-width: 0.15; marker-start: url(#dim-start); marker-end: url(#dim-end); }
      .leader { fill: none; stroke: #656b71; stroke-width: 0.14; marker-end: url(#leader-arrow); }
      .phase { font-family: "Times New Roman", "Latin Modern Roman", serif; font-size: 1.15px; font-style: italic; fill: #62686e; }
    </style>
  </defs>

  <g inkscape:groupmode="layer" inkscape:label="01 Background" id="layer-background">
    <rect width="53" height="26.5" fill="#ffffff"/>
    <text class="panel" x="0.7" y="2.8">(b)</text>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="02 Circuit Lines" id="layer-lines">
    <path class="timeline" d="M4.3,5.8 H51.5"/>
    <path class="timeline" d="M4.3,12.5 H51.5"/>
    <path class="timeline" d="M4.3,20.2 H51.5"/>
    <path class="guide" d="M16.5,8.35 H29.5"/>
    <path class="guide" d="M16.5,15.05 H29.5"/>
    <path class="scan-arrow" d="M25.5,3.3 H29.5"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="03 Pulses" id="layer-pulses">
    <!-- Scanned Ramsey -->
    <g color="#4b5056" transform="translate(8.5,5.8)"><use xlink:href="#sin2-envelope"/><use xlink:href="#sin2-carrier"/></g>
    <g color="#70767c" opacity="0.24" transform="translate(25.5,5.8)"><use xlink:href="#sin2-envelope"/><use xlink:href="#sin2-carrier"/></g>
    <g color="#4b5056" transform="translate(29.5,5.8)"><use xlink:href="#sin2-envelope"/><use xlink:href="#sin2-carrier"/></g>

    <!-- Fixed-delay I/Q Ramsey -->
    <g color="#4b5056" transform="translate(8.5,12.5)"><use xlink:href="#sin2-envelope"/><use xlink:href="#sin2-carrier"/></g>
    <g color="#4b5056" transform="translate(29.5,12.5)"><use xlink:href="#sin2-envelope"/><use xlink:href="#sin2-carrier"/></g>

    <!-- Zero-delay phase-cycled short-pulse probe -->
    <g color="#4b5056" transform="translate(21.5,20.2)"><use xlink:href="#sin2-envelope"/><use xlink:href="#sin2-carrier"/></g>
    <g color="#4b5056" transform="translate(29.5,20.2)"><use xlink:href="#sin2-envelope"/><use xlink:href="#sin2-carrier"/></g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="04 Measurement" id="layer-measurement">
    <use xlink:href="#meter-symbol" transform="translate(43.5,3.65)"/>
    <use xlink:href="#meter-symbol" transform="translate(43.5,10.35)"/>
    <use xlink:href="#meter-symbol" transform="translate(43.5,18.05)"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="05 Labels" id="layer-labels">
    <text class="math" x="12.5" y="3.35" text-anchor="middle">R<tspan baseline-shift="sub" font-size="1.03">y</tspan>(&#960;/2)</text>
    <text class="math" x="33.5" y="3.35" text-anchor="middle">R<tspan baseline-shift="sub" font-size="1.03">&#966;</tspan>(&#960;/2)</text>
    <text class="small" x="27.5" y="2.85" text-anchor="middle">scan &#964;</text>
    <text class="math" x="23" y="7.95" text-anchor="middle">&#964;<tspan baseline-shift="sub" font-size="1.03">j</tspan></text>

    <text class="math" x="12.5" y="10.05" text-anchor="middle">R<tspan baseline-shift="sub" font-size="1.03">y</tspan>(&#960;/2)</text>
    <text class="math" x="33.5" y="10.05" text-anchor="middle">R<tspan baseline-shift="sub" font-size="1.03">&#966;</tspan>(&#960;/2)</text>
    <text class="math" x="23" y="14.65" text-anchor="middle">&#964;<tspan baseline-shift="sub" font-size="1.03">0</tspan></text>

    <text class="math" x="25.5" y="17.75" text-anchor="middle">R<tspan baseline-shift="sub" font-size="1.03">y</tspan>(&#945;)</text>
    <text class="math" x="33.5" y="17.75" text-anchor="middle">R<tspan baseline-shift="sub" font-size="1.03">&#177;x</tspan>(&#945;)</text>
    <text class="math" x="29.5" y="25.75" text-anchor="middle">&#964;=0</text>
    <path class="leader" d="M29.5,24.55 V22.65"/>
    <text class="math" x="49.4" y="19.55" text-anchor="middle">p<tspan baseline-shift="sub" font-size="1.03">&#177;X</tspan></text>
  </g>
</svg>
