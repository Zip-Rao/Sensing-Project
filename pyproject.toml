[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sqc"
dynamic = ["version"]
description = "Superconducting Transmon qubit quantum sensing simulation platform (cQED full-stack, QuTiP-based)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zip" }]
keywords = [
    "quantum",
    "superconducting-qubit",
    "transmon",
    "quantum-sensing",
    "qutip",
    "cQED",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "qutip>=5.0,<6.0",
    "numpy>=1.24,<3.0",
    "scipy>=1.11,<2.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
demo = ["gradio>=4.0,<5.0"]
test = [
    "pytest>=7.4,<9.0",
    "pytest-xdist>=3.5,<4.0",
    "pytest-cov>=4.1,<6.0",
]

# Version is the single source of truth in sqc/__init__.py:__version__.
[tool.setuptools.dynamic]
version = { attr = "sqc.__version__" }

# The distributed product is the self-contained `sqc` package. The legacy
# `src` package and its `src_mirror` facade are also shipped (public) so the
# equivalence test-suite runs on a fresh clone / in CI; R1 keeps src/ frozen.
[tool.setuptools.packages.find]
where = ["."]
include = ["sqc*", "src", "src_mirror*"]
